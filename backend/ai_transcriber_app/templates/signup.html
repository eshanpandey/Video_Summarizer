{% extends 'base.html' %}
{% block title %}Sign up · Summarizer AI{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-10 bg-white dark:bg-gray-800 p-6 rounded-lg shadow">
  <h1 class="text-2xl font-bold text-center mb-4">Sign up</h1>
  {% if error_message %}<p class="mb-4 text-center text-red-600">{{ error_message }}</p>{% endif %}
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label for="username" class="block text-sm mb-1">Username</label>
      <input id="username" name="username" required autofocus class="w-full rounded-md border border-gray-300 dark:border-gray-600 bg-transparent p-2">
    </div>
    <div>
      <label for="email" class="block text-sm mb-1">Email</label>
      <input type="email" id="email" name="email" class="w-full rounded-md border border-gray-300 dark:border-gray-600 bg-transparent p-2">
    </div>
    <div>
      <label for="password" class="block text-sm mb-1">Password</label>
      <input type="password" id="password" name="password" required class="w-full rounded-md border border-gray-300 dark:border-gray-600 bg-transparent p-2">
    </div>
    <div>
      <label for="repeatPassword" class="block text-sm mb-1">Repeat password</label>
      <input type="password" id="repeatPassword" name="repeatPassword" required class="w-full rounded-md border border-gray-300 dark:border-gray-600 bg-transparent p-2">
    </div>
    <button type="submit" class="w-full rounded-md bg-emerald-600 text-white p-2 hover:bg-emerald-700">Create account</button>
  </form>
  <p class="mt-4 text-center text-sm">Already have an account? <a href="{% url 'login' %}" class="text-emerald-600 hover:underline">Log in</a></p>
</div>
{% endblock %}
