{% extends 'base.html' %}
{% block content %}
<h1 class="text-2xl font-semibold mb-2">Hey {{ user.username }}!</h1>
<p class="text-gray-600 dark:text-gray-400 mb-6">Paste a YouTube link and get readable notes. Long videos keep processing in the background, so you can leave this page and find them later in My notes.</p>

<div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow">
  <form id="summarizeForm" class="flex flex-col sm:flex-row gap-3">
    <input id="youtubeLink" type="url" required placeholder="https://www.youtube.com/watch?v=..." class="flex-grow rounded-md border border-emerald-400 bg-transparent p-2">
    <button id="submitButton" type="submit" class="rounded-md bg-emerald-600 text-white px-4 py-2 hover:bg-emerald-700 disabled:opacity-50">Summarize</button>
  </form>

  <div id="progress" class="hidden mt-6 flex items-center gap-3 text-gray-700 dark:text-gray-300">
    <div class="spinner"></div>
    <span id="progressText">Queued</span>
  </div>

  <p id="errorBox" class="hidden mt-6 text-red-600"></p>

  <section id="result" class="hidden mt-8">
    <h2 id="resultTitle" class="text-xl font-semibold mb-3"></h2>
    <div id="resultContent" class="whitespace-pre-line text-gray-800 dark:text-gray-200 leading-relaxed"></div>
    <a id="resultLink" href="#" class="inline-block mt-4 text-emerald-600 hover:underline">Open full notes</a>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script>
  const form = document.getElementById('summarizeForm');
  const button = document.getElementById('submitButton');
  const progress = document.getElementById('progress');
  const progressText = document.getElementById('progressText');
  const errorBox = document.getElementById('errorBox');
  const result = document.getElementById('result');

  function show(el, visible) { el.classList.toggle('hidden', !visible); }

  function showError(message) {
    errorBox.textContent = message || 'Something went wrong. Please try again.';
    show(errorBox, true);
    show(progress, false);
    button.disabled = false;
  }

  // Model output is plain text: always render it as text, never as HTML.
  function showResult(job) {
    document.getElementById('resultTitle').textContent = job.title || 'Notes';
    document.getElementById('resultContent').textContent = job.content;
    document.getElementById('resultLink').href = job.article_url;
    show(progress, false);
    show(result, true);
    button.disabled = false;
  }

  async function poll(statusUrl) {
    let delay = 1500;
    while (true) {
      await new Promise(resolve => setTimeout(resolve, delay));
      delay = Math.min(delay * 1.3, 5000);
      let job;
      try {
        const response = await fetch(statusUrl);
        job = await response.json();
        if (!response.ok) return showError(job.error);
      } catch (e) {
        continue;  // transient network error: keep polling
      }
      progressText.textContent = job.stage || job.status;
      if (job.status === 'done') return showResult(job);
      if (job.status === 'failed') return showError(job.error);
    }
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    show(errorBox, false);
    show(result, false);
    button.disabled = true;
    progressText.textContent = 'Queued';
    show(progress, true);

    try {
      const response = await fetch('{% url "generate-transcript" %}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
        body: JSON.stringify({ link: document.getElementById('youtubeLink').value }),
      });
      const job = await response.json();
      if (!response.ok) return showError(job.error);
      if (job.status === 'done') return showResult(job);
      if (job.status === 'failed') return showError(job.error);
      poll(job.status_url);
    } catch (e) {
      showError();
    }
  });
</script>
{% endblock %}
