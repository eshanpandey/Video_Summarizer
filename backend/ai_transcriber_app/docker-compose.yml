# Local production-like stack: `docker compose up --build`, then open http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: summarizer
      POSTGRES_USER: summarizer
      POSTGRES_PASSWORD: summarizer
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://summarizer:summarizer@db:5432/summarizer
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-compose-secret-change-me}
      DJANGO_SECURE_SSL_REDIRECT: "false"
    depends_on:
      - db

volumes:
  pgdata:
